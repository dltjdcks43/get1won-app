name: Manual Android device tests
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manual-device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  device-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            bash ./gradlew connectedDebugAndroidTest --no-daemon; result=$?; adb pull /data/local/tmp/get1won-ux app/build/reports/ux; if [ "$result" -ne 0 ]; then exit "$result"; fi; test "$(find app/build/reports/ux -name '*.png' | wc -l)" -ge 17
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/ux/
