name: Android checks and APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Unit tests, lint, debug APK
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Name APK with source commit
        id: apk
        shell: bash
        run: |
          short_sha=$(git rev-parse --short=8 HEAD)
          apk_name="get1won-v2-${short_sha}-debug"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${apk_name}.apk"
          echo "name=${apk_name}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: app/build/outputs/apk/debug/${{ steps.apk.outputs.name }}.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
