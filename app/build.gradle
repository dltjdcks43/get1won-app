plugins { id 'com.android.application' }
def gitSha = providers.exec {
    workingDir rootDir
    commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
    ignoreExitValue true
}.standardOutput.asText.get().trim()
if (!(gitSha ==~ /[0-9a-f]{8}/)) gitSha = 'unknown'
android {
    buildFeatures { buildConfig true }
    namespace 'app.get1won'
    compileSdk 36
    defaultConfig { applicationId 'app.get1won'; minSdk 34; targetSdk 36; versionCode 9; versionName '3.0-beta1'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'GIT_SHA', '"' + gitSha + '"'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
dependencies {
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
